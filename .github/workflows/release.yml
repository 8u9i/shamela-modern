name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for node-gyp on Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build App
        run: npm run build

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always

  publish-db:
    name: Upload DB notice
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create DB notice
        run: |
          cat > DB_README.md << 'EOF'
          # قاعدة بيانات المكتبة الشاملة الإباضية

          هذه القاعدة مطلوبة لتشغيل تطبيق المكتبة الشاملة الإباضية.

          ## التثبيت التلقائي

          التطبيق سيطلب تحميل قاعدة البيانات تلقائياً عند أول تشغيل. كل ما عليك هو اتصال بالإنترنت.

          ## التثبيت اليدوي

          إذا أردت وضع قاعدة البيانات يدوياً:

          1. حمّل ملف shamela.db من الرابط: https://eshamila.net/shamela.db
          2. ضع الملف في أحد المجلدات التالية حسب نظامك:
             - ويندوز: %APPDATA%/Al-Maktaba Al-Shamela/data/
             - ماك: ~/Library/Application Support/Al-Maktaba Al-Shamela/data/
             - لينكس: ~/.config/Al-Maktaba Al-Shamela/data/

          ملاحظة: التطبيق يبحث عن shamela.db في مجلد data داخل مجلد إعدادات التطبيق.
          EOF

      - name: Upload DB notice to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v${{ needs.release.outputs.version }} DB_README.md --clobber || echo "no release yet"

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release, publish-db]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## 📦 الإصدار

          ⚠️ هذا المشروع غير رسمي — المطور ليس عضوًا في فريق المكتبة الشاملة.
          قاعدة البيانات لا تُضمّن مع الإصدار. يشملها التطبيق تلقائياً عند أول تشغيل عبر رابط التحميل.

          ### ⬇ التحميل

          | الملف | المنصة |
          |------|--------|
          | `Al-Maktaba-Al-Shamela-Setup-*.exe` | ويندوز |
          | `Al-Maktaba-Al-Shamela-*-arm64.dmg` | ماك (Apple Silicon) |
          | `Al-Maktaba-Al-Shamela-*.AppImage` | لينكس |
          | `Al-Maktaba-Al-Shamela-*.deb` | لينكس (deb) |

          راجع [CHANGELOG.md](https://github.com/8u9i/shamela-modern/blob/master/CHANGELOG.md) للتفاصيل الكاملة.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          NOTES=$(cat RELEASE_NOTES.md)
          echo "Publishing release: $VERSION"
          gh release edit "$VERSION" --draft=false --title "المكتبة الشاملة الإباضية $VERSION" --notes "$NOTES"
          echo "✅ Published: $VERSION"
