name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for node-gyp on Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Create placeholder database
        run: node scripts/create-placeholder-db.js

      - name: Verify placeholder DB exists
        shell: bash
        run: test -f data/shamela.db && echo "DB found" || (echo "::error::data/shamela.db missing" && exit 1)

      - name: Build App
        run: npm run build

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Package and publish (CI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always

  publish-db:
    name: Publish database asset
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create placeholder DB notice
        run: |
          cat > DB_README.md << 'EOF'
          # قاعدة بيانات المكتبة الشاملة الإباضية

          هذه القاعدة مطلوبة لتشغيل تطبيق المكتبة الشاملة الإباضية.

          ## التثبيت

          1. حمّل التطبيق من الإصدارات (Assets)
          2. ضع ملف shamela.db في مجلد البيانات:
             - ويندوز: %APPDATA%/Al-Maktaba Al-Shamela/data/
             - ماك: ~/Library/Application Support/Al-Maktaba Al-Shamela/data/
             - لينكس: ~/.config/Al-Maktaba Al-Shamela/data/

          أو ضعه في مجلد resources داخل مجلد التثبيت:
          - ويندوز: Program Files/Al-Maktaba Al-Shamela/resources/shamela.db
          - ماك: Al-Maktaba Al-Shamela.app/Contents/Resources/shamela.db
          - لينكس: /opt/Al-Maktaba Al-Shamela/resources/shamela.db

          ملاحظة: الإصدارات المبنية بالـ CI لا تحتوي على قاعدة البيانات الفعلية.
          يجب على الناشر بناء التطبيق محلياً باستخدام npm run package:full.
          EOF

      - name: Upload DB notice to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} DB_README.md --clobber || echo "no release yet"
