name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for node-gyp on Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create placeholder database
        run: node scripts/create-placeholder-db.js

      - name: Verify placeholder DB exists
        shell: bash
        run: test -f data/shamela.db && echo "DB found" || (echo "::error::data/shamela.db missing" && exit 1)

      - name: Build App
        run: npm run build

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always

  publish-db:
    name: Upload DB notice
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create DB notice
        run: |
          cat > DB_README.md << 'EOF'
          # قاعدة بيانات المكتبة الشاملة الإباضية

          هذه القاعدة مطلوبة لتشغيل تطبيق المكتبة الشاملة الإباضية.

          ## التثبيت

          1. حمّل التطبيق من الإصدارات (Assets)
          2. ضع ملف shamela.db في مجلد البيانات:
             - ويندوز: %APPDATA%/Al-Maktaba Al-Shamela/data/
             - ماك: ~/Library/Application Support/Al-Maktaba Al-Shamela/data/
             - لينكس: ~/.config/Al-Maktaba Al-Shamela/data/

          أو ضعه في مجلد resources داخل مجلد التثبيت:
          - ويندوز: Program Files/Al-Maktaba Al-Shamela/resources/shamela.db
          - ماك: Al-Maktaba Al-Shamela.app/Contents/Resources/shamela.db
          - لينكس: /opt/Al-Maktaba Al-Shamela/resources/shamela.db

          ملاحظة: الإصدارات المبنية بالـ CI لا تحتوي على قاعدة البيانات الفعلية.
          يجب على الناشر بناء التطبيق محلياً باستخدام npm run package:full.
          EOF

      - name: Upload DB notice to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v${{ needs.release.outputs.version }} DB_README.md --clobber || echo "no release yet"

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release, publish-db]
    if: always()
    steps:
      - name: Publish the release (remove draft status)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          echo "Publishing release: $VERSION"
          gh release edit "$VERSION" \
            --draft=false \
            --title "المكتبة الشاملة الإباضية $VERSION" \
            --notes "## 📦 الإصدار $VERSION

> ⚠️ هذا المشروع غير رسمي — المطور ليس عضوًا في فريق المكتبة الشاملة.
> الإصدارات المبنية بالـ CI لا تحتوي على قاعدة البيانات الفعلية shamela.db (2.1 GB).

### ⬇ التحميل

| الملف | المنصة |
|------|--------|
| \`Al-Maktaba-Al-Shamela-Setup-${{ needs.release.outputs.version }}-x64.exe\` | 🪟 ويندوز |
| \`Al-Maktaba-Al-Shamela-${{ needs.release.outputs.version }}-arm64.dmg\` | 🍎 ماك (Apple Silicon) |
| \`Al-Maktaba-Al-Shamela-${{ needs.release.outputs.version }}.AppImage\` | 🐧 لينكس |
| \`Al-Maktaba-Al-Shamela-${{ needs.release.outputs.version }}.deb\` | 🐧 لينكس (deb) |

راجع [CHANGELOG.md](https://github.com/8u9i/shamela-modern/blob/master/CHANGELOG.md) للتفاصيل الكاملة."
          echo "✅ Release published: $VERSION"