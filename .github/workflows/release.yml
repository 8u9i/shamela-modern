name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (for node-gyp on Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build App
        run: npm run build

      - name: Rebuild native dependencies for Electron
        run: npx electron-builder install-app-deps

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish always

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## 📦 الإصدار

          ⚠️ هذا المشروع غير رسمي — المطور ليس عضوًا في فريق المكتبة الشاملة.
          قاعدة البيانات تُبنى تلقائياً عند أول تشغيل عبر API الموقع الرسمي.

          ### ⬇ التحميل

          | الملف | المنصة |
          |------|--------|
          | `Al-Maktaba-Al-Shamela-Setup-*.exe` | ويندوز |
          | `Al-Maktaba-Al-Shamela-*-arm64.dmg` | ماك (Apple Silicon) |
          | `Al-Maktaba-Al-Shamela-*.deb` | لينكس |

          راجع [CHANGELOG.md](https://github.com/8u9i/shamela-modern/blob/master/CHANGELOG.md) للتفاصيل الكاملة.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          NOTES=$(cat RELEASE_NOTES.md)
          echo "Publishing release: $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --draft=false --title "المكتبة الشاملة الإباضية $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" --title "المكتبة الشاملة الإباضية $VERSION" --notes "$NOTES"
          fi
          echo "✅ Published: $VERSION"
